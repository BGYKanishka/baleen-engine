name: Build and Release Baleen

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a tag starting with 'v', e.g., v1.0.0

permissions:
  contents: write # Required to create a GitHub Release

jobs:
  release:
    name: Create Release and Build Binaries
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2' # Update this if you use a different Go version
          cache: true

      - name: Run Tests
        run: go test ./...

      - name: Run Vet
        run: go vet ./...

      - name: Build Binaries
        run: |
          mkdir -p build
          
          echo "Building for Linux (amd64)..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/baleen-linux-amd64 ./cmd/baleen
          
          echo "Building for Linux (arm64)..."
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/baleen-linux-arm64 ./cmd/baleen
          
          echo "Building for macOS (amd64 / Intel)..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/baleen-darwin-amd64 ./cmd/baleen
          
          echo "Building for macOS (arm64 / Apple Silicon)..."
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/baleen-darwin-arm64 ./cmd/baleen
          
          echo "Building for Windows (amd64)..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/baleen-windows-amd64.exe ./cmd/baleen

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/baleen-linux-amd64
            build/baleen-linux-arm64
            build/baleen-darwin-amd64
            build/baleen-darwin-arm64
            build/baleen-windows-amd64.exe

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: yehankanishka/baleen-engine

      - name: Build and push Extension Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: yehankanishka/baleen-engine:latest,yehankanishka/baleen-engine:${{ github.ref_name }}
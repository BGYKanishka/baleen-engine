name: Build and Release Baleen

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Run Tests and Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run Tests
        run: go test ./...

      - name: Run Vet
        run: go vet ./...

  release_binaries:
    name: Build Binaries & Create Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      - name: Get Version Without V
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "val=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Binaries
        run: |
          mkdir -p build
          
          LDFLAGS="-s -w -X 'github.com/BGYKanishka/baleen-engine/internal/version.Version=${{ steps.version.outputs.val }}'"
          
          echo "Building for Linux (amd64)..."
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/baleen-linux-amd64 ./cmd/baleen
          
          echo "Building for Linux (arm64)..."
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o build/baleen-linux-arm64 ./cmd/baleen
          
          echo "Building for macOS (amd64 / Intel)..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/baleen-darwin-amd64 ./cmd/baleen
          
          echo "Building for macOS (arm64 / Apple Silicon)..."
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o build/baleen-darwin-arm64 ./cmd/baleen
          
          echo "Building for Windows (amd64)..."
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o build/baleen-windows-amd64.exe ./cmd/baleen

          echo "Building for Windows (arm64)..."
          GOOS=windows GOARCH=arm64 go build -ldflags="$LDFLAGS" -o build/baleen-windows-arm64.exe ./cmd/baleen

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            build/baleen-linux-amd64
            build/baleen-linux-arm64
            build/baleen-darwin-amd64
            build/baleen-darwin-arm64
            build/baleen-windows-amd64.exe
            build/baleen-windows-arm64.exe

      - name: Upload Binaries for Docker Job
        uses: actions/upload-artifact@v5
        with:
          name: build-binaries
          path: build/

  publish_docker:
    name: Build and Push Docker Image
    needs: release_binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Get Version Without V
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "val=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Binaries
        uses: actions/download-artifact@v5
        with:
          name: build-binaries
          path: build/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: yehankanishka/baleen-engine

      - name: Build and push Extension Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.val }}
          tags: yehankanishka/baleen-engine:latest,yehankanishka/baleen-engine:${{ steps.version.outputs.val }}